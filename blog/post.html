<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title id="page-title">Loading… — Danalytica Blog</title>
<meta name="description" id="page-desc" content=""/>
<meta property="og:title" id="og-title" content=""/>
<meta property="og:description" id="og-desc" content=""/>
<meta property="og:type" content="article"/>
<meta property="og:site_name" content="Danalytica"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<link rel="alternate" type="application/rss+xml" title="Danalytica Blog" href="/blog/feed.xml"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#091f26;--ink-mid:#0d2d38;--teal:#00cccc;--teal-dk:#005c77;--teal-lt:#33d9d9;
  --green:#99d683;--white:#f4fafa;--muted:#6a9aaa;--border:rgba(0,204,204,.15);
  --ff-h:'Syne',sans-serif;--ff-b:'DM Sans',sans-serif;--r:12px;--r-lg:20px;
}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--white);font-family:var(--ff-b);font-size:16px;line-height:1.65;overflow-x:hidden}
.container{width:min(1180px,92vw);margin-inline:auto}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--ff-h);line-height:1.15}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.1rem 0;
  background:rgba(9,31,38,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between}
.nav-logo img{height:44px;width:auto}
.nav-links{display:flex;gap:2rem;list-style:none;font-size:.9rem;font-weight:500}
.nav-links a{color:var(--muted);transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:var(--teal)}
.nav-cta{background:var(--teal);color:var(--ink);font-family:var(--ff-h);font-weight:700;
  font-size:.85rem;padding:.6rem 1.4rem;border-radius:var(--r);white-space:nowrap}
.nav-cta:hover{background:var(--teal-lt)}
.nav-burger{display:none;cursor:pointer;flex-direction:column;gap:5px}
.nav-burger span{width:24px;height:2px;background:var(--white);border-radius:2px}

/* POST LAYOUT */
.post-wrap{display:grid;grid-template-columns:1fr min(720px,100%) 1fr;padding-top:6rem}
.post-wrap > *{grid-column:2}

/* POST HEADER */
.post-header{padding:3rem 0 2.5rem;border-bottom:1px solid var(--border)}
.breadcrumb{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--muted);margin-bottom:1.5rem}
.breadcrumb a:hover{color:var(--teal)}
.breadcrumb .sep{opacity:.4}
.post-category-badge{display:inline-block;font-family:var(--ff-h);font-size:.68rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--teal);background:rgba(0,204,204,.07);
  border:1px solid var(--border);padding:.25em .75em;border-radius:999px;margin-bottom:1rem}
.post-header h1{font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:800;letter-spacing:-.02em;
  margin-bottom:1rem;line-height:1.1}
.post-byline{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;
  font-size:.85rem;color:var(--muted)}
.post-byline .author{display:flex;align-items:center;gap:.5rem}
.author-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--teal-dk),var(--teal));
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;
  color:var(--ink);flex-shrink:0}
.byline-sep{opacity:.3}

/* POST BODY — prose styles */
.post-body{padding:2.5rem 0;font-size:1.05rem;line-height:1.8;color:#cde4e4}
.post-body h2{font-family:var(--ff-h);font-size:1.6rem;font-weight:700;
  color:var(--white);margin:2.5rem 0 .8rem;letter-spacing:-.02em}
.post-body h3{font-family:var(--ff-h);font-size:1.2rem;font-weight:700;
  color:var(--white);margin:2rem 0 .6rem}
.post-body h4{font-family:var(--ff-h);font-size:1rem;font-weight:700;
  color:var(--teal);margin:1.5rem 0 .4rem;text-transform:uppercase;letter-spacing:.05em}
.post-body p{margin-bottom:1.3rem}
.post-body ul,.post-body ol{margin:1rem 0 1.3rem 1.5rem}
.post-body li{margin-bottom:.4rem}
.post-body strong{color:var(--white);font-weight:600}
.post-body em{color:var(--teal-lt)}
.post-body a{color:var(--teal);border-bottom:1px solid rgba(0,204,204,.3);
  transition:border-color .2s}
.post-body a:hover{border-color:var(--teal)}
.post-body blockquote{border-left:3px solid var(--teal);padding:.8rem 1.2rem;
  margin:1.5rem 0;background:rgba(0,204,204,.04);border-radius:0 var(--r) var(--r) 0;
  color:var(--white);font-style:italic}
.post-body blockquote p{margin-bottom:0}
.post-body code{background:rgba(0,204,204,.1);border:1px solid var(--border);
  padding:.1em .4em;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.85em;
  color:var(--teal-lt)}
.post-body pre{background:var(--ink-mid);border:1px solid var(--border);
  border-radius:var(--r);padding:1.2rem 1.5rem;margin:1.5rem 0;overflow-x:auto}
.post-body pre code{background:none;border:none;padding:0;font-size:.88rem;color:#a8d8d8}
.post-body hr{border:none;border-top:1px solid var(--border);margin:2.5rem 0}
.post-body img{border-radius:var(--r);margin:1.5rem 0;width:100%}
.post-body table{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:.9rem}
.post-body th{background:var(--ink-mid);padding:.7rem 1rem;text-align:left;
  font-family:var(--ff-h);font-size:.8rem;letter-spacing:.05em;color:var(--teal);
  border-bottom:1px solid var(--border)}
.post-body td{padding:.7rem 1rem;border-bottom:1px solid rgba(255,255,255,.05)}

/* TAGS ROW */
.post-tags-row{display:flex;flex-wrap:wrap;gap:.5rem;padding:1.5rem 0;
  border-top:1px solid var(--border)}
.post-tag{font-size:.75rem;font-weight:600;background:rgba(255,255,255,.04);color:var(--muted);
  padding:.3em .7em;border-radius:4px;border:1px solid rgba(255,255,255,.07)}

/* SHARE */
.share-row{padding:1.5rem 0 2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.share-label{font-size:.82rem;color:var(--muted);font-weight:500}
.share-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.4em 1em;
  border-radius:var(--r);font-size:.8rem;font-weight:600;font-family:var(--ff-h);
  border:1px solid var(--border);color:var(--muted);transition:all .2s;cursor:pointer;
  background:transparent}
.share-btn:hover{border-color:var(--teal);color:var(--teal)}

/* BACK / NEXT NAVIGATION */
.post-nav{display:grid;grid-template-columns:1fr 1fr;gap:1rem;
  padding:2rem 0 4rem;border-top:1px solid var(--border)}
.post-nav-item{background:var(--ink-mid);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:1.4rem;transition:border-color .2s}
.post-nav-item:hover{border-color:var(--teal-dk)}
.post-nav-label{font-size:.7rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.post-nav-title{font-family:var(--ff-h);font-size:.95rem;font-weight:700;line-height:1.3}
.post-nav-item.next{text-align:right}

/* LOADING / ERROR */
.post-loading{text-align:center;padding:6rem 0;color:var(--muted)}
.post-error{text-align:center;padding:4rem 0}
.post-error h2{font-family:var(--ff-h);color:var(--white);margin-bottom:.5rem}
.post-error p{color:var(--muted);margin-bottom:1.5rem}
.btn-back{display:inline-block;background:var(--teal);color:var(--ink);
  font-family:var(--ff-h);font-weight:700;padding:.7rem 1.6rem;border-radius:var(--r)}

/* FOOTER */
footer{background:var(--ink);border-top:1px solid var(--border);padding:3rem 0 2rem}
.footer-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1.5rem}
.footer-logo img{height:40px}
.footer-links{display:flex;gap:1.5rem;list-style:none}
.footer-links a{font-size:.85rem;color:var(--muted);transition:color .2s}
.footer-links a:hover{color:var(--teal)}
.footer-copy{font-size:.8rem;color:var(--muted)}

@media(max-width:768px){
  .nav-links,.nav-cta{display:none}
  .nav-links.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;
    background:rgba(9,31,38,.97);padding:1.5rem 2rem;gap:1.2rem;border-bottom:1px solid var(--border)}
  .nav-burger{display:flex}
  .post-wrap{grid-template-columns:0 1fr 0;padding-top:5rem}
  .post-nav{grid-template-columns:1fr}
  .footer-inner{flex-direction:column;text-align:center}
}
</style>
</head>
<body>

<nav>
  <div class="container nav-inner">
    <a href="/" class="nav-logo"><img src="/logo.svg" alt="Danalytica"/></a>
    <ul class="nav-links" id="nav-links">
      <li><a href="/#services">Services</a></li>
      <li><a href="/#work">Work</a></li>
      <li><a href="/#process">Process</a></li>
      <li><a href="/#about">About</a></li>
      <li><a href="/blog/" class="active">Blog</a></li>
      <li><a href="https://stepin.danalytica.com" target="_blank" rel="noopener">StepIn &#8599;</a></li>
    </ul>
    <a href="/#contact" class="nav-cta">Get in touch</a>
    <div class="nav-burger" id="nav-burger"><span></span><span></span><span></span></div>
  </div>
</nav>

<div class="post-wrap" id="post-wrap">
  <div class="post-loading">Loading post…</div>
</div>

<footer>
  <div class="container footer-inner">
    <a href="/" class="footer-logo"><img src="/logo-small.svg" alt="Danalytica"/></a>
    <ul class="footer-links">
      <li><a href="/#services">Services</a></li>
      <li><a href="/#work">Work</a></li>
      <li><a href="/blog/">Blog</a></li>
      <li><a href="/#about">About</a></li>
    </ul>
    <p class="footer-copy">&copy; 2025 Danalytica. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script>
// ── SAME POSTS REGISTRY ──────────────────────────────────────────────────────
// Keep this in sync with blog/index.html
var POSTS = [
  {
    slug: "bridging-information-language-barriers",
    title: "Bridging Information and Language Barriers: A Dual-Path Media Approach to Immigrant Integration",
    date: "2026-03-27",
    category: "Integration Research",
    tags: ["Integration", "Language Learning", "Civic Participation", "Research"],
    excerpt: "A research note on how media consumption and language acquisition together shape immigrant integration outcomes.",
    emoji: "🧠",
    author: "StepIn Team",
    readTime: "6 min"
  },
  {
    slug: "from-research-to-reality-how-stepin-applies-the-dual-path-approach",
    title: "From Research to Reality: How StepIn Applies the Dual-Path Approach",
    date: "2026-06-08",
    category: "Product & Impact",
    tags: ["Integration", "Civic Tech", "AI", "Language Learning"],
    excerpt: "How we turned academic research into a practical tool — a Telegram bot that helps newcomers understand Dutch news and navigate life in the Netherlands.",
    emoji: "🚀",
    author: "StepIn Team",
    readTime: "6 min"
  },
  {
    slug: "when-science-becomes-political-covid-climate-twitter",
    title: "When Science Becomes Political: Analyzing COVID‑19 and Climate Change Discourse on Twitter",
    date: "2025-05-15",
    category: "Research Engineering",
    tags: ["Data Scraping", "Text Classification", "Research Support", "Social Media Analysis", "Disinformation"],
    excerpt: "How a research team used computational methods to understand when the politicization of science on social media becomes problematic for democracy — and how we helped them get the data.",
    emoji: "🔬",
    author: "Danalytica Team",
    readTime: "8 min"
  }
];

function formatDate(str) {
  var d = new Date(str + "T00:00:00");
  return d.toLocaleDateString("en-GB", {day:"numeric", month:"long", year:"numeric"});
}

function getSlugFromURL() {
  var params = new URLSearchParams(window.location.search);
  return params.get("slug") || "";
}

function getPostMeta(slug) {
  for (var i = 0; i < POSTS.length; i++) {
    if (POSTS[i].slug === slug) return {post: POSTS[i], index: i};
  }
  return null;
}

function renderError(msg) {
  document.getElementById("post-wrap").innerHTML =
    '<div class="post-error">'
    + '<h2>' + msg + '</h2>'
    + '<p>The post you\'re looking for doesn\'t exist or couldn\'t be loaded.</p>'
    + '<a href="/blog/" class="btn-back">&#8592; Back to Blog</a>'
    + '</div>';
}

function renderPost(slug, markdown, meta, prevPost, nextPost) {
  var post = meta;

  // Update meta tags
  document.getElementById("page-title").textContent = post.title + " — Danalytica Blog";
  document.getElementById("page-desc").setAttribute("content", post.excerpt);
  document.getElementById("og-title").setAttribute("content", post.title);
  document.getElementById("og-desc").setAttribute("content", post.excerpt);

  // Configure marked
  marked.setOptions({ breaks: true, gfm: true });

  var bodyHtml = marked.parse(markdown);
  var tagsHtml = post.tags.map(function(t){ return '<span class="post-tag">' + t + '</span>'; }).join('');

  var prevHtml = prevPost
    ? '<a href="/blog/posts/' + prevPost.slug + '.html" class="post-nav-item prev">'
      + '<div class="post-nav-label">&#8592; Previous</div>'
      + '<div class="post-nav-title">' + prevPost.title + '</div>'
      + '</a>'
    : '<div></div>';

  var nextHtml = nextPost
    ? '<a href="/blog/posts/' + nextPost.slug + '.html" class="post-nav-item next">'
      + '<div class="post-nav-label">Next &#8594;</div>'
      + '<div class="post-nav-title">' + nextPost.title + '</div>'
      + '</a>'
    : '<div></div>';

  var shareUrl = encodeURIComponent("https://danalytica.com/blog/post.html?slug=" + slug);
  var shareTitle = encodeURIComponent(post.title);

  document.getElementById("post-wrap").innerHTML =
    '<div class="post-header container" style="grid-column:2;max-width:720px;margin:0 auto;padding-left:0;padding-right:0">'
    + '<div class="breadcrumb">'
    +   '<a href="/">Home</a><span class="sep">/</span>'
    +   '<a href="/blog/">Blog</a><span class="sep">/</span>'
    +   '<span>' + post.category + '</span>'
    + '</div>'
    + '<div class="post-category-badge">' + post.category + '</div>'
    + '<h1>' + post.title + '</h1>'
    + '<div class="post-byline">'
    +   '<span class="author"><span class="author-avatar">D</span>' + (post.author || "Danalytica Team") + '</span>'
    +   '<span class="byline-sep">|</span>'
    +   '<span>' + formatDate(post.date) + '</span>'
    +   '<span class="byline-sep">|</span>'
    +   '<span>' + post.readTime + ' read</span>'
    + '</div>'
    + '</div>'

    + '<div class="post-body" id="post-body">' + bodyHtml + '</div>'

    + '<div class="post-tags-row">' + tagsHtml + '</div>'

    + '<div class="share-row">'
    + '<span class="share-label">Share:</span>'
    + '<a href="https://twitter.com/intent/tweet?url=' + shareUrl + '&text=' + shareTitle + '" target="_blank" class="share-btn">&#x1D54F; Twitter</a>'
    + '<a href="https://www.linkedin.com/sharing/share-offsite/?url=' + shareUrl + '" target="_blank" class="share-btn">in LinkedIn</a>'
    + '</div>'

    + '<div class="post-nav">' + prevHtml + nextHtml + '</div>';
}

// ── MAIN ────────────────────────────────────────────────────────────────────
var slug = getSlugFromURL();
var found = getPostMeta(slug);

if (!found) {
  renderError("Post not found");
} else {
  var post  = found.post;
  var idx   = found.index;
  var prev  = idx > 0 ? POSTS[idx - 1] : null;
  var next  = idx < POSTS.length - 1 ? POSTS[idx + 1] : null;

  fetch("/posts/" + slug + ".txt")
    .then(function(r) {
      if (!r.ok) throw new Error("not found");
      return r.text();
    })
    .then(function(md) {
      // Strip optional YAML front matter (--- ... ---)
      var clean = md.replace(/^---[\s\S]*?---\n?/, "");
      renderPost(slug, clean, post, prev, next);
    })
    .catch(function() {
      renderError("Couldn't load post");
    });
}

// Mobile nav
document.getElementById("nav-burger").addEventListener("click", function() {
  document.getElementById("nav-links").classList.toggle("open");
});
</script>
</body>
</html>
